<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- White background circle -->
  <circle cx="100" cy="100" r="98" fill="white" stroke="#1e3a8a" stroke-width="3"/>

  <!-- Outer ring label area -->
  <circle cx="100" cy="100" r="90" fill="none" stroke="#2563eb" stroke-width="1.5" stroke-dasharray="4 2"/>

  <!-- Blue top arc band -->
  <path d="M 20 80 Q 100 20 180 80 Q 140 55 100 50 Q 60 55 20 80 Z" fill="#1e3a8a"/>

  <!-- Milk drop / teardrop icon in center -->
  <g transform="translate(100, 95)">
    <!-- Drop shape -->
    <path d="M 0,-35 C 18,-15 24,5 18,18 C 12,30 -12,30 -18,18 C -24,5 -18,-15 0,-35 Z" fill="#2563eb"/>
    <!-- Inner highlight -->
    <ellipse cx="-6" cy="-10" rx="5" ry="8" fill="white" opacity="0.4" transform="rotate(-20)"/>
  </g>

  <!-- NARAYAN text top arc -->
  <path id="topArc" d="M 32,100 A 68,68 0 0,1 168,100" fill="none"/>
  <text font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="white" letter-spacing="3">
    <textPath href="#topArc" startOffset="10%">NARAYAN DAIRY</textPath>
  </text>

  <!-- Bottom text -->
  <text x="100" y="158" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="600" fill="#1e3a8a" letter-spacing="2">CRATE MANAGEMENT</text>

  <!-- Decorative lines below milk drop -->
  <line x1="60" y1="130" x2="88" y2="130" stroke="#93c5fd" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="112" y1="130" x2="140" y2="130" stroke="#93c5fd" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Small star/diamond accents -->
  <polygon points="100,126 102,131 107,131 103,134 105,139 100,136 95,139 97,134 93,131 98,131" fill="#2563eb" opacity="0.7"/>
</svg>
